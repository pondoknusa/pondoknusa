name: Release

# npm publishing moved to a local script: `npm run release:publish`.
# npm's long-lived automation tokens are deprecated, so packages are
# published interactively under the maintainer's npm login (web auth + 2FA).
# This workflow only creates the GitHub Release when a version tag lands.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
